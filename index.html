<script>
  const CONFIG = {
    // Aus Google Cloud Console → APIs & Dienste → Anmeldedaten → OAuth-Client-ID (Typ "Webanwendung")
    CLIENT_ID: '871728667732-0mevk8giflbkkpcegt5l26v3o2bjlpam.apps.googleusercontent.com',
    // Name des Drive-Ordners, in dem alles abgelegt wird (wird automatisch angelegt, falls nicht vorhanden)
    FOLDER_NAME: 'Gesangs-App Lyrics',

    SCOPE: 'https://www.googleapis.com/auth/drive.file'
  };

<style>
  :root{
    --bg:#faf9f7; --panel:#ffffff; --border:#e2ddd6; --text:#2a2622; --muted:#8a8178;
    --accent:#6b4f3b; --accent-light:#ede6dd; --danger:#b3452f; --ok:#4a7a58;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:12px; padding:10px 14px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0; z-index:20;
  }
  header h1{font-size:16px; margin:0; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  button{
    font:inherit; border:1px solid var(--border); background:var(--panel); color:var(--text);
    padding:8px 12px; border-radius:8px; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  button:active{background:var(--accent-light);}
  button:disabled{opacity:.4; cursor:default;}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.icon{padding:8px; width:38px; height:38px; display:flex; align-items:center; justify-content:center;}
  #status{font-size:12px; color:var(--muted); min-width:90px; text-align:right;}
  #status.saving{color:var(--accent);}
  #status.error{color:var(--danger);}
  #status.ok{color:var(--ok);}
  #status.error{cursor:pointer; text-decoration:underline dotted;}

  #app{flex:1; display:flex; min-height:0; position:relative;}

  #sidebar{
    width:260px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
    display:flex; flex-direction:column; transition:transform .2s ease; z-index:15;
  }
  #sidebar-header{padding:10px; border-bottom:1px solid var(--border); display:flex; gap:8px;}
  #fileInput{display:none;}
  #fileList{flex:1; overflow-y:auto; padding:6px;}
  .file-item{
    display:flex; align-items:center; gap:8px; padding:10px 8px; border-radius:8px; cursor:pointer;
    font-size:14px;
  }
  .file-item:hover, .file-item.active{background:var(--accent-light);}
  .file-item .name{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .file-item .del{opacity:.5; border:none; background:none; padding:4px;}
  .file-item .del:hover{opacity:1; color:var(--danger);}
  .file-item .type-icon{width:20px; text-align:center; color:var(--muted); font-size:12px; flex-shrink:0;}

  #viewer{flex:1; display:flex; flex-direction:column; min-width:0; position:relative;}
  #toolbar{
    display:flex; align-items:center; gap:6px; padding:8px; background:var(--panel);
    border-bottom:1px solid var(--border); flex-wrap:wrap; flex-shrink:0;
  }
  #toolbar .sep{width:1px; height:24px; background:var(--border); margin:0 4px;}
  .swatch{width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; flex-shrink:0;}
  .swatch.active{border-color:var(--text);}
  #widthRange{width:80px;}
  #pageNav, #zoomNav{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted);}
  #zoomLabel{min-width:42px; text-align:center;}
  #fingerBtn{font-size:13px; padding:8px 10px;}

  /* margin:auto statt justify-content:center, damit gezoomte Seiten links nicht abgeschnitten werden */
  #canvasWrap{
    flex:1; overflow:auto; position:relative; display:flex;
    background:#ded7cc; padding:16px; overscroll-behavior:contain;
  }
  #canvasStack{position:relative; margin:auto; flex:none; box-shadow:0 2px 10px rgba(0,0,0,.15); background:#fff; touch-action:none;}
  #baseCanvas, #inkCanvas{position:absolute; top:0; left:0;}
  #inkCanvas{touch-action:none;}

  #notesPanel{
    border-top:1px solid var(--border); background:var(--panel); flex-shrink:0;
    display:flex; flex-direction:column; max-height:30vh;
  }
  #notesPanel textarea{
    border:none; resize:none; font:inherit; padding:10px 14px; outline:none; background:transparent;
    min-height:70px;
  }
  #notesToggle{
    display:flex; align-items:center; justify-content:space-between; padding:4px 10px;
    font-size:12px; color:var(--muted); border-bottom:1px solid var(--border);
  }
  #notesTabs{display:flex; gap:4px;}
  #notesTabs button, #notesArrow{border:none; background:none; padding:4px 8px; font-size:12px; color:var(--muted); border-radius:6px;}
  #notesTabs button.active{background:var(--accent-light); color:var(--text); font-weight:600;}

  #empty{flex:1; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:20px;}
  #signedOut{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px;}
  #signedOut p{color:var(--muted); max-width:340px; font-size:14px;}

  #sidebarToggle{display:none;}
  @media (max-width: 760px){
    #sidebarToggle{display:flex;}
    #sidebar{position:absolute; top:0; bottom:0; left:0; transform:translateX(-100%); box-shadow:4px 0 12px rgba(0,0,0,.15);}
    #sidebar.open{transform:translateX(0);}
    #app{position:relative;}
  }
</style>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script type="module">
// Polyfill für neue JS-Funktionen, die pdf.js 6.x voraussetzt (ältere Tablet-Browser kennen sie noch nicht)
for (const C of [Map, WeakMap]) {
  if (!C.prototype.getOrInsert) C.prototype.getOrInsert = function (k, v) { if (!this.has(k)) this.set(k, v); return this.get(k); };
  if (!C.prototype.getOrInsertComputed) C.prototype.getOrInsertComputed = function (k, f) { if (!this.has(k)) this.set(k, f(k)); return this.get(k); };
}

// pdf.js wird erst beim ersten Öffnen einer PDF geladen (App startet auch, wenn das CDN nicht erreichbar ist)
let pdfjsLib = null;
async function getPdfjs() {
  if (pdfjsLib) return pdfjsLib;
  const m = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs');
  m.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs';
  pdfjsLib = m;
  return m;
}

// ---------------------------------------------------------------
// Konstanten / Helfer
// ---------------------------------------------------------------
const REF_W = 900;              // Referenzbreite: Strichstärke "3" entspricht 3 px auf einer 900 px breiten Seite
const LEGACY_REF_W = 900;       // Annahme für Annotationen im alten Pixel-Format (v1)
const MIN_ZOOM = 0.4, MAX_ZOOM = 5;
const MIN_POINT_DIST = 0.0008;  // in Seitenbreiten; ignoriert Punkte, die praktisch aufeinander liegen

const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = (k) => { try { localStorage.removeItem(k); } catch (e) {} };
const r5 = (v) => Math.round(v * 1e5) / 1e5;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const escQ = (s) => String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const emptyAnnot = () => ({ version: 2, notes: '', pageNotes: {}, pages: {} });

// ---------------------------------------------------------------
// State
// ---------------------------------------------------------------
let accessToken = null;
let tokenExpiry = 0;
let tokenClient = null;
let tokenWaiters = [];
let folderId = lsGet('gapp_folderId') || null;

let files = [];
let currentFile = null;
let currentDoc = null;        // pdf.js-Dokument
let currentImg = null;        // HTMLImageElement (Bilddatei)
let currentImgUrl = null;
let currentPage = 1;
let totalPages = 1;
let annotFileId = null;
let annotData = emptyAnnot();
let ready = false;            // Datei + Annotationen vollständig geladen
let pageReady = false;        // aktuelle Seite gerendert (Zeichnen erlaubt)
let history = [];             // Undo-Verlauf (nur diese Sitzung)

let zoom = 1;
let pageAspect = 1.414;       // Höhe/Breite der aktuellen Seite
let renderSeq = 0, renderTask = null, renderTimer = null;
let openSeq = 0;

let dirty = false;
let saveTimer = null;
let saving = Promise.resolve();
let notesScope = 'file';      // 'file' | 'page'

let tool = { color: '#1a1a1a', width: 3, eraser: false };
let fingerMode = lsGet('gapp_fingerMode') || 'auto';   // auto | draw | pan
let penSeen = false, penDown = false;
let drawing = false, strokeErasing = false, strokePointer = null;
let currentStroke = null, erasedItems = null;
const touches = new Map();
let panState = null, pinchState = null, gestureLock = false;

// ---------------------------------------------------------------
// DOM refs
// ---------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const authBtn = $('authBtn'), authBtn2 = $('authBtn2');
const statusEl = $('status');
const fileListEl = $('fileList');
const sidebar = $('sidebar');
const signedOutEl = $('signedOut');
const mainViewerEl = $('mainViewer');
const emptyEl = $('empty');
const currentTitleEl = $('currentTitle');
const canvasWrap = $('canvasWrap');
const stack = $('canvasStack');
const baseCanvas = $('baseCanvas'), inkCanvas = $('inkCanvas');
const baseCtx = baseCanvas.getContext('2d'), inkCtx = inkCanvas.getContext('2d');
const notesArea = $('notesArea');
const pageLabel = $('pageLabel');

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = cls || '';
}

// Verständliche Fehlertexte – auf dem Handy gibt es keine Konsole, daher: Status antippen zeigt die Details
let lastErrorDetail = '';
function explainError(e) {
  const m = String((e && e.message) || e);
  if (/accessNotConfigured|SERVICE_DISABLED|has not been used|is disabled/i.test(m))
    return 'Die Google Drive API ist im Cloud-Projekt dieser Client-ID nicht aktiviert (Cloud Console → APIs & Dienste → Bibliothek → «Google Drive API» → Aktivieren).';
  if (/access_denied/.test(m))
    return 'Zugriff verweigert – ist dein Google-Konto im OAuth-Zustimmungsbildschirm als Testnutzer eingetragen?';
  if (/popup_closed|popup_failed/.test(m))
    return 'Das Anmelde-Popup wurde geschlossen oder vom Browser blockiert.';
  if (/unauthorized/.test(m)) return 'Sitzung abgelaufen – bitte anmelden.';
  if (/insufficientPermissions|insufficient/i.test(m)) return 'Fehlende Berechtigung – bitte neu anmelden und den Zugriff auf Drive erlauben.';
  return m;
}
function fail(prefix, e) {
  console.error(e);
  const raw = String((e && e.message) || e);
  lastErrorDetail = prefix + '\n\n' + explainError(e) + (explainError(e) !== raw ? '\n\n(Technisch: ' + raw.slice(0, 400) + ')' : '');
  setStatus(prefix, 'error');
}
function showAuthError(text) {
  const el = $('authError');
  el.textContent = text || '';
  el.style.display = text ? 'block' : 'none';
}
statusEl.addEventListener('click', () => { if (statusEl.className === 'error' && lastErrorDetail) alert(lastErrorDetail); });

// ---------------------------------------------------------------
// Auth (Google Identity Services – Token-Client, rein clientseitig)
// Das Token gilt ~1 h. Es wird im Browser zwischengespeichert (Neuladen innerhalb der Stunde bleibt angemeldet).
// Ein Erneuern ohne Klick klappt nur, wenn der Browser das Google-Popup zulässt – sonst genügt ein Tipp auf «Neu anmelden».
// ---------------------------------------------------------------
function requestToken() {
  return new Promise((resolve, reject) => {
    tokenWaiters.push({ resolve, reject });
    if (tokenWaiters.length > 1) return;            // Anfrage läuft bereits
    try { tokenClient.requestAccessToken({ prompt: '' }); }
    catch (e) { const w = tokenWaiters; tokenWaiters = []; w.forEach(x => x.reject(e)); }
  });
}

function saveToken() { lsSet('gapp_token', JSON.stringify({ t: accessToken, exp: tokenExpiry })); }
function loadStoredToken() {
  try {
    const o = JSON.parse(lsGet('gapp_token') || 'null');
    if (o && o.t && o.exp > Date.now() + 60000) { accessToken = o.t; tokenExpiry = o.exp; return true; }
  } catch (e) {}
  lsDel('gapp_token');
  return false;
}
function dropToken() { accessToken = null; tokenExpiry = 0; lsDel('gapp_token'); }

function initAuth() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.CLIENT_ID,
    scope: CONFIG.SCOPE,
    callback: (resp) => {
      const w = tokenWaiters; tokenWaiters = [];
      if (resp.error || !resp.access_token) { w.forEach(x => x.reject(new Error(resp.error || 'no_token'))); return; }
      accessToken = resp.access_token;
      tokenExpiry = Date.now() + ((Number(resp.expires_in) || 3600) - 60) * 1000;
      saveToken();
      w.forEach(x => x.resolve(accessToken));
    },
    error_callback: (err) => {
      const w = tokenWaiters; tokenWaiters = [];
      w.forEach(x => x.reject(new Error((err && err.type) || 'auth_error')));
    }
  });
  // Noch gültiges Token vom letzten Besuch? Dann direkt weitermachen, ohne erneutes Login.
  if (loadStoredToken()) afterSignIn().catch(e => { fail('Verbindung zu Drive fehlgeschlagen', e); showAuthError(explainError(e)); });
}

async function ensureToken() {
  if (accessToken && Date.now() < tokenExpiry) return accessToken;
  if (!tokenClient) throw new Error('unauthorized');
  try { return await requestToken(); }
  catch (e) {
    dropToken();
    authBtn.textContent = 'Neu anmelden';
    setStatus('Sitzung abgelaufen – bitte «Neu anmelden» tippen', 'error');
    throw new Error('unauthorized');
  }
}

async function afterSignIn() {
  await ensureFolder();
  await loadFileList();
  authBtn.textContent = 'Angemeldet';
  showAuthError('');
  signedOutEl.style.display = 'none';
  if (!currentFile) emptyEl.style.display = 'flex';
  if (statusEl.className === 'error') setStatus('');
  if (dirty) saveNow();       // ungespeicherte Änderungen nach erneutem Login nachliefern
}

async function signIn() {
  if (!tokenClient || String(CONFIG.CLIENT_ID).startsWith('DEINE_')) {
    alert('CLIENT_ID in der Konfiguration am Dateianfang eintragen.');
    return;
  }
  try {
    await requestToken();
    await afterSignIn();
  } catch (e) {
    // Bei «origin_mismatch» erscheint der Fehler auf der Google-Seite im Popup; hier kommt nur «popup_closed» o. ä. an.
    fail('Anmeldung fehlgeschlagen', e);
    showAuthError(explainError(e));
  }
}
authBtn.addEventListener('click', signIn);
authBtn2.addEventListener('click', signIn);

// Diagnose: Diese Angaben müssen zur Google Cloud Console passen
(function showDiag() {
  const el = $('diag');
  const id = String(CONFIG.CLIENT_ID);
  el.textContent = `Diese Seite läuft auf: ${location.origin}` + (location.protocol === 'file:' ? ' (lokale Datei – Google-Login funktioniert nur über die gehostete https-Adresse)' : '')
    + ` · Client-ID: ${id.length > 24 ? id.slice(0, 12) + '…' + id.slice(-27) : id}`;
})();

// ---------------------------------------------------------------
// Drive helpers
// ---------------------------------------------------------------
const DRIVE_FILES = 'https://www.googleapis.com/drive/v3/files';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';

async function driveFetch(url, opts = {}, retry = true) {
  await ensureToken();
  const headers = Object.assign({ Authorization: 'Bearer ' + accessToken }, opts.headers || {});
  const res = await fetch(url, Object.assign({}, opts, { headers }));
  if (res.status === 401) {
    dropToken();
    if (retry) return driveFetch(url, opts, false);
    authBtn.textContent = 'Neu anmelden';
    setStatus('Sitzung abgelaufen – bitte «Neu anmelden» tippen', 'error');
    throw new Error('unauthorized');
  }
  if (!res.ok) { const t = await res.text(); throw new Error('Drive-Fehler: ' + res.status + ' ' + t); }
  return res;
}

async function ensureFolder() {
  if (folderId) {
    // Gecachte Ordner-ID prüfen (Ordner evtl. gelöscht oder anderes Konto)
    try {
      const chk = await driveFetch(`${DRIVE_FILES}/${folderId}?fields=id,trashed`);
      const info = await chk.json();
      if (info && !info.trashed) return folderId;
    } catch (e) { if (e.message === 'unauthorized') throw e; }
    folderId = null; lsDel('gapp_folderId');
  }
  const q = encodeURIComponent(`name='${escQ(CONFIG.FOLDER_NAME)}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res = await driveFetch(`${DRIVE_FILES}?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  if (data.files && data.files.length) {
    folderId = data.files[0].id;
  } else {
    const createRes = await driveFetch(DRIVE_FILES, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: CONFIG.FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' })
    });
    const created = await createRes.json();
    folderId = created.id;
  }
  lsSet('gapp_folderId', folderId);
  return folderId;
}

async function loadFileList() {
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and (mimeType='application/pdf' or mimeType contains 'image/') and not name contains '.annotations.json'`);
  let all = [], token = null;
  do {
    const url = `${DRIVE_FILES}?q=${q}&orderBy=name&pageSize=200&fields=nextPageToken,files(id,name,mimeType,modifiedTime)` + (token ? `&pageToken=${encodeURIComponent(token)}` : '');
    const res = await driveFetch(url);
    const data = await res.json();
    all = all.concat(data.files || []);
    token = data.nextPageToken || null;
  } while (token);
  files = all;
  renderFileList();
}

function renderFileList() {
  fileListEl.innerHTML = '';
  if (!files.length) {
    const p = document.createElement('div');
    p.style.cssText = 'padding:16px;color:var(--muted);font-size:13px;';
    p.textContent = 'Noch keine Blätter. Oben hochladen.';
    fileListEl.appendChild(p);
    return;
  }
  files.forEach(f => {
    const item = document.createElement('div');
    item.className = 'file-item' + (currentFile && currentFile.id === f.id ? ' active' : '');
    const icon = document.createElement('span');
    icon.className = 'type-icon';
    icon.textContent = f.mimeType === 'application/pdf' ? 'PDF' : 'IMG';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = f.name;                       // textContent statt innerHTML (Dateinamen können < > enthalten)
    const del = document.createElement('button');
    del.className = 'del'; del.title = 'In Papierkorb'; del.textContent = '🗑';
    name.addEventListener('click', () => openFile(f));
    icon.addEventListener('click', () => openFile(f));
    del.addEventListener('click', (e) => { e.stopPropagation(); trashFile(f); });
    item.append(icon, name, del);
    fileListEl.appendChild(item);
  });
}

async function trashFile(f) {
  if (!confirm(`"${f.name}" in den Papierkorb verschieben?`)) return;
  const isCur = currentFile && currentFile.id === f.id;
  try {
    await driveFetch(`${DRIVE_FILES}/${f.id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ trashed: true })
    });
  } catch (e) { setStatus('Fehler beim Löschen', 'error'); console.error(e); return; }
  if (isCur) {
    openSeq++;
    clearTimeout(saveTimer); dirty = false;
    await saving;
    closeCurrent();
    currentTitleEl.textContent = 'Gesangs-App – Lyric-Blätter';
    mainViewerEl.style.display = 'none';
    emptyEl.style.display = 'flex';
  }
  await loadFileList();
}

// Upload per XMLHttpRequest: liefert Fortschritt und Zeitlimit (fetch kann beides nicht) – bei Handy-Fotos sonst «hängt» die Anzeige
const MAX_IMG_DIM = 3000;          // Fotos werden vor dem Upload auf max. 3000 px (lange Seite) verkleinert
const RESUMABLE_FROM = 5 * 1024 * 1024;   // Drive: Multipart nur bis ca. 5 MB empfohlen

function xhrSend(method, url, headers, body, onProgress, timeoutMs) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open(method, url);
    for (const [k, v] of Object.entries(headers)) x.setRequestHeader(k, v);
    x.timeout = timeoutMs;
    x.upload.onprogress = (e) => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = () => resolve(x);
    x.onerror = () => reject(new Error('Netzwerkfehler'));
    x.ontimeout = () => reject(new Error('Zeitüberschreitung'));
    x.send(body);
  });
}

async function driveUpload(method, url, headers, body, onProgress) {
  for (let attempt = 0; attempt < 2; attempt++) {
    await ensureToken();
    const x = await xhrSend(method, url, Object.assign({ Authorization: 'Bearer ' + accessToken }, headers), body, onProgress, 300000);
    if (x.status === 401 && attempt === 0) { dropToken(); continue; }
    if (x.status === 401) throw new Error('unauthorized');
    if (x.status < 200 || x.status >= 300) throw new Error('Drive-Fehler ' + x.status + ' ' + x.responseText.slice(0, 200));
    return x;
  }
  throw new Error('unauthorized');
}

async function prepareUpload(file) {
  if (!file.type.startsWith('image/') || /gif|svg/.test(file.type)) return file;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, MAX_IMG_DIM / Math.max(bmp.width, bmp.height));
    if (s === 1 && file.size <= 1.5e6) { if (bmp.close) bmp.close(); return file; }
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
    g.imageSmoothingQuality = 'high';
    g.drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.88));
    if (!blob || (s === 1 && blob.size >= file.size)) return file;
    return new File([blob], file.name.replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch (e) { return file; }      // z. B. HEIC ohne Browser-Unterstützung: Original hochladen
}

async function uploadMultipart(file, metadata, onProgress) {
  const boundary = 'gappboundary' + Date.now();
  const head = new TextEncoder().encode(`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`);
  const tail = new TextEncoder().encode(`\r\n--${boundary}--`);
  const x = await driveUpload('POST', `${DRIVE_UPLOAD}?uploadType=multipart&fields=id,name,mimeType`,
    { 'Content-Type': `multipart/related; boundary=${boundary}` }, new Blob([head, file, tail]), onProgress);
  return JSON.parse(x.responseText);
}

async function uploadResumable(file, metadata, onProgress) {
  const init = await driveUpload('POST', `${DRIVE_UPLOAD}?uploadType=resumable&fields=id,name,mimeType`, {
    'Content-Type': 'application/json; charset=UTF-8',
    'X-Upload-Content-Type': file.type || 'application/octet-stream',
    'X-Upload-Content-Length': String(file.size)
  }, JSON.stringify(metadata));
  const loc = init.getResponseHeader('Location');
  if (!loc) throw new Error('kein Upload-Link');
  const x = await driveUpload('PUT', loc, { 'Content-Type': file.type || 'application/octet-stream' }, file, onProgress);
  return JSON.parse(x.responseText);
}

async function uploadFiles(fileListRaw) {
  const list = Array.from(fileListRaw);
  let firstId = null;
  for (let i = 0; i < list.length; i++) {
    const label = list.length > 1 ? ` (${i + 1}/${list.length})` : '';
    try {
      setStatus('Bereite vor …' + label, 'saving');
      const file = await prepareUpload(list[i]);
      const prog = (f) => setStatus(`Lade hoch … ${Math.round(f * 100)} %${label}`, 'saving');
      prog(0);
      const metadata = { name: file.name, parents: [folderId] };
      let created = null;
      if (file.size > RESUMABLE_FROM) {
        try { created = await uploadResumable(file, metadata, prog); }
        catch (e) { if (e.message === 'unauthorized') throw e; console.warn('Resumable-Upload fehlgeschlagen, versuche Multipart:', e); }
      }
      if (!created) created = await uploadMultipart(file, metadata, prog);
      if (!firstId) firstId = created.id;
    } catch (e) {
      fail(e.message === 'unauthorized' ? 'Sitzung abgelaufen – bitte «Neu anmelden» tippen' : `Upload fehlgeschlagen: ${list[i].name}`, e);
      await loadFileList().catch(() => {});
      return;
    }
  }
  setStatus('Hochgeladen', 'ok');
  await loadFileList();
  const f = files.find(x => x.id === firstId);
  if (f) openFile(f);                                  // hochgeladenes Blatt direkt anzeigen
}

// ---------------------------------------------------------------
// Annotationen (Format v2: Koordinaten in Seitenbreiten, geräteunabhängig)
//   { version:2, notes, pageNotes:{"1":".."}, pages:{"1":[ {c, w, p:[[x,y,(druck)],...], er?} ]} }
//   x,y: 1.0 = volle Seitenbreite (y ebenfalls in Seitenbreiten); w: Strichstärke in Seitenbreiten
// ---------------------------------------------------------------
function normalizeAnnot(d) {
  if (!d || typeof d !== 'object') return emptyAnnot();
  if (d.version >= 2) {
    d.pages = d.pages || {}; d.pageNotes = d.pageNotes || {}; d.notes = d.notes || '';
    return d;
  }
  // Migration v1 (Pixelkoordinaten, Bezugsbreite unbekannt → Annahme LEGACY_REF_W)
  const out = emptyAnnot();
  out.notes = d.notes || '';
  out.migrated = { from: 1, refWidth: LEGACY_REF_W };
  for (const [k, arr] of Object.entries(d.pages || {})) {
    out.pages[k] = (arr || []).filter(s => s && s.points && s.points.length).map(s => {
      const o = {
        c: s.color || '#1a1a1a',
        w: (s.width || 3) / LEGACY_REF_W,
        p: s.points.map(q => [r5(q.x / LEGACY_REF_W), r5(q.y / LEGACY_REF_W)])
      };
      if (s.eraser) o.er = 1;
      return o;
    });
  }
  return out;
}

async function findAnnotationFile(baseId) {
  const name = `${baseId}.annotations.json`;
  const q = encodeURIComponent(`'${folderId}' in parents and trashed=false and name='${escQ(name)}'`);
  const res = await driveFetch(`${DRIVE_FILES}?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  return data.files && data.files.length ? data.files[0].id : null;
}

async function loadAnnotations(baseId) {
  const id = await findAnnotationFile(baseId);
  if (!id) return { id: null, data: emptyAnnot() };
  const res = await driveFetch(`${DRIVE_FILES}/${id}?alt=media`);
  return { id, data: normalizeAnnot(await res.json()) };
}

// Speichern: serialisiert (nie zwei Uploads gleichzeitig → keine doppelten Annotationsdateien)
function queueSave() {
  if (!ready) return;
  dirty = true;
  setStatus('Ungespeicherte Änderung', '');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 2000);
}
function saveNow() {
  clearTimeout(saveTimer);
  saving = saving.then(doSave);
  return saving;
}
async function flushSave() {
  clearTimeout(saveTimer);
  if (dirty) await saveNow(); else await saving;
}

async function doSave() {
  if (!dirty || !currentFile || !ready) return;
  const file = currentFile;
  const snapshot = JSON.stringify(annotData);
  const fid = annotFileId;
  dirty = false;                                   // Änderungen während des Uploads setzen es erneut
  setStatus('Speichert …', 'saving');
  try {
    const metadata = fid ? {} : { name: `${file.id}.annotations.json`, parents: [folderId] };
    const boundary = 'gappboundary' + Date.now();
    const head = new TextEncoder().encode(`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n`);
    const tail = new TextEncoder().encode(`\r\n--${boundary}--`);
    const body = new Blob([head, snapshot, tail]);
    const headers = { 'Content-Type': `multipart/related; boundary=${boundary}` };
    if (fid) {
      await driveFetch(`${DRIVE_UPLOAD}/${fid}?uploadType=multipart`, { method: 'PATCH', headers, body });
    } else {
      const res = await driveFetch(`${DRIVE_UPLOAD}?uploadType=multipart&fields=id`, { method: 'POST', headers, body });
      const created = await res.json();
      if (currentFile === file) annotFileId = created.id;
    }
    if (dirty) setStatus('Ungespeicherte Änderung', ''); else setStatus('Gespeichert', 'ok');
  } catch (e) {
    dirty = true;
    console.error(e);
    if (e.message !== 'unauthorized') {
      setStatus('Fehler beim Speichern – neuer Versuch folgt', 'error');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 10000);
    }
  }
}

// Nichts verlieren beim Schliessen / App-Wechsel
window.addEventListener('beforeunload', (e) => {
  if (dirty) { flushSave(); e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && dirty) flushSave(); });
window.addEventListener('pagehide', () => { if (dirty) flushSave(); });

// ---------------------------------------------------------------
// Viewer
// ---------------------------------------------------------------
function closeCurrent() {
  ready = false; pageReady = false;
  cancelStroke();
  clearTimeout(renderTimer);
  renderSeq++;
  if (renderTask) { try { renderTask.cancel(); } catch (e) {} renderTask = null; }
  if (currentDoc) { try { currentDoc.destroy(); } catch (e) {} currentDoc = null; }
  if (currentImgUrl) { URL.revokeObjectURL(currentImgUrl); currentImgUrl = null; }
  currentImg = null;
  currentFile = null; annotFileId = null; annotData = emptyAnnot();
  history = []; zoom = 1; currentPage = 1; totalPages = 1; notesScope = 'file';
  renderFileList();
}

function loadImage(blob) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { currentImgUrl = url; resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht geladen werden')); };
    img.src = url;
  });
}

async function openFile(f) {
  const seq = ++openSeq;
  // Erst offene Änderungen des bisherigen Blatts sichern – sonst gehen sie beim Wechsel verloren
  await flushSave();
  if (seq !== openSeq) return;
  if (dirty && !confirm('Letzte Änderungen konnten nicht gespeichert werden. Trotzdem wechseln (Änderungen gehen verloren)?')) return;
  dirty = false;

  closeCurrent();
  currentFile = f;
  currentTitleEl.textContent = f.name;
  emptyEl.style.display = 'none';
  mainViewerEl.style.display = 'flex';
  sidebar.classList.remove('open');
  renderFileList();
  baseCtx.clearRect(0, 0, baseCanvas.width, baseCanvas.height);
  inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
  updateZoomLabel(); updatePageNav(); bindNotes();
  setStatus('Lädt …', 'saving');

  try {
    const ann = await loadAnnotations(f.id);
    if (seq !== openSeq) return;
    const res = await driveFetch(`${DRIVE_FILES}/${f.id}?alt=media`);
    const blob = await res.blob();
    if (seq !== openSeq) return;

    if (f.mimeType === 'application/pdf') {
      const lib = await getPdfjs();
      const buf = await blob.arrayBuffer();
      const doc = await lib.getDocument({ data: buf }).promise;
      if (seq !== openSeq) { doc.destroy(); return; }
      currentDoc = doc;
      totalPages = doc.numPages;
    } else {
      const img = await loadImage(blob);
      if (seq !== openSeq) { URL.revokeObjectURL(currentImgUrl); currentImgUrl = null; return; }
      currentImg = img;
      totalPages = 1;
    }
    annotFileId = ann.id;
    annotData = ann.data;
    ready = true;
    bindNotes(); updatePageNav();
    await renderPage();
    if (seq === openSeq) setStatus('');
  } catch (e) {
    if (seq === openSeq) fail(e.message === 'unauthorized' ? 'Sitzung abgelaufen – bitte «Neu anmelden» tippen' : 'Fehler beim Laden', e);
  }
}

// --- Layout / Rendering ---------------------------------------
function fitWidth() { return Math.max(200, Math.min(canvasWrap.clientWidth - 32, 1400)); }

function applyCssSize() {
  const w = Math.round(fitWidth() * zoom), h = Math.round(w * pageAspect);
  stack.style.width = w + 'px'; stack.style.height = h + 'px';
  [baseCanvas, inkCanvas].forEach(c => { c.style.width = w + 'px'; c.style.height = h + 'px'; });
}

// Pixelbreite der Zeichenfläche: Retina-scharf (devicePixelRatio), aber mit Obergrenze für den Speicher
function targetPixelWidth() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  let px = Math.min(Math.round(fitWidth() * zoom * dpr), 4096);
  const maxArea = 16e6;
  if (px * px * pageAspect > maxArea) px = Math.floor(Math.sqrt(maxArea / pageAspect));
  return Math.max(px, 100);
}

function commitCanvas(off) {
  [baseCanvas, inkCanvas].forEach(c => { c.width = off.width; c.height = off.height; });
  baseCtx.drawImage(off, 0, 0);
  applyCssSize();
  redrawInk();
  pageReady = true;
}

// Rendert offscreen und übernimmt nur das jeweils neueste Ergebnis → keine Render-Kollisionen beim schnellen Blättern/Zoomen
async function renderPage() {
  if (!ready) return;
  const seq = ++renderSeq;
  if (renderTask) { try { renderTask.cancel(); } catch (e) {} renderTask = null; }

  if (currentDoc) {
    const page = await currentDoc.getPage(currentPage);
    if (seq !== renderSeq) return;
    const vp1 = page.getViewport({ scale: 1 });
    pageAspect = vp1.height / vp1.width;
    const px = targetPixelWidth();
    const vp = page.getViewport({ scale: px / vp1.width });
    const off = document.createElement('canvas');
    off.width = Math.ceil(vp.width); off.height = Math.ceil(vp.height);
    const task = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
    renderTask = task;
    try { await task.promise; }
    catch (e) { if (e && e.name === 'RenderingCancelledException') return; throw e; }
    if (seq !== renderSeq) return;
    renderTask = null;
    commitCanvas(off);
  } else if (currentImg) {
    pageAspect = currentImg.naturalHeight / currentImg.naturalWidth;
    const px = targetPixelWidth();
    const off = document.createElement('canvas');
    off.width = px; off.height = Math.round(px * pageAspect);
    const octx = off.getContext('2d');
    octx.imageSmoothingQuality = 'high';
    octx.drawImage(currentImg, 0, 0, off.width, off.height);   // auf Zielgrösse skaliert (vorher: unskaliert → Ausschnitt)
    commitCanvas(off);
  }
}

function scheduleRender(ms) {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { renderPage().catch(e => { console.error(e); setStatus('Renderfehler', 'error'); }); }, ms);
}

function updatePageNav() {
  pageLabel.textContent = `${currentPage} / ${totalPages}`;
  $('prevPage').disabled = currentPage <= 1;
  $('nextPage').disabled = currentPage >= totalPages;
}

async function goPage(p) {
  if (!ready || p < 1 || p > totalPages || p === currentPage) return;
  cancelStroke();
  currentPage = p;
  pageReady = false;
  inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
  updatePageNav(); bindNotes();
  canvasWrap.scrollTop = 0;
  try { await renderPage(); }
  catch (e) { console.error(e); setStatus('Renderfehler', 'error'); pageReady = true; }
}
$('prevPage').addEventListener('click', () => goPage(currentPage - 1));
$('nextPage').addEventListener('click', () => goPage(currentPage + 1));

// --- Zoom ------------------------------------------------------
function updateZoomLabel() { $('zoomLabel').textContent = Math.round(zoom * 100) + '%'; }

function setZoom(z) {
  zoom = clamp(z, MIN_ZOOM, MAX_ZOOM);
  applyCssSize(); updateZoomLabel(); scheduleRender(250);   // sofort per CSS skalieren, scharf nachrendern
}
function anchorAt(fx, fy, cx, cy) {
  const r = stack.getBoundingClientRect();
  canvasWrap.scrollLeft += (r.left + fx * r.width) - cx;
  canvasWrap.scrollTop += (r.top + fy * r.height) - cy;
}
function zoomAt(z, cx, cy) {
  const r = stack.getBoundingClientRect();
  const fx = (cx - r.left) / r.width, fy = (cy - r.top) / r.height;
  setZoom(z);
  anchorAt(fx, fy, cx, cy);
}
function wrapCenter() { const r = canvasWrap.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; }
$('zoomIn').addEventListener('click', () => { if (ready) zoomAt(zoom * 1.25, ...wrapCenter()); });
$('zoomOut').addEventListener('click', () => { if (ready) zoomAt(zoom / 1.25, ...wrapCenter()); });
$('zoomFit').addEventListener('click', () => { if (!ready) return; setZoom(1); canvasWrap.scrollLeft = 0; });
canvasWrap.addEventListener('wheel', (e) => {
  if (!e.ctrlKey || !ready) return;
  e.preventDefault();
  zoomAt(zoom * Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY);
}, { passive: false });

function startPinch() {
  const [a, b] = [...touches.values()];
  const r = stack.getBoundingClientRect();
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  pinchState = { d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, z0: zoom, fx: (mx - r.left) / r.width, fy: (my - r.top) / r.height };
  gestureLock = true;
}
function updatePinch() {
  const arr = [...touches.values()];
  if (arr.length < 2 || !pinchState) return;
  const [a, b] = arr;
  const d = Math.hypot(a.x - b.x, a.y - b.y);
  setZoom(pinchState.z0 * d / pinchState.d0);
  anchorAt(pinchState.fx, pinchState.fy, (a.x + b.x) / 2, (a.y + b.y) / 2);
}

// ---------------------------------------------------------------
// Ink / Annotationen
// ---------------------------------------------------------------
function getStrokes() {
  const key = String(currentPage);
  if (!annotData.pages[key]) annotData.pages[key] = [];
  return annotData.pages[key];
}

function redrawInk() {
  inkCtx.clearRect(0, 0, inkCanvas.width, inkCanvas.height);
  for (const s of getStrokes()) drawStroke(s);
  if (drawing && currentStroke) drawStroke(currentStroke);
}

const pw = (s, i) => { const pr = s.p[i][2]; return pr == null ? 1 : 0.35 + pr * 1.3; };
function applyStyle(ctx, s) {
  ctx.globalCompositeOperation = s.er ? 'destination-out' : 'source-over';
  ctx.strokeStyle = s.c; ctx.fillStyle = s.c;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
}
// Einzelsegmente: Kopf (Linie), Mitte (quadratische Kurve über Mittelpunkte = glatt), Ende (Linie), Punkt
function seg(ctx, s, W, kind, i) {
  const P = s.p, n = P.length;
  const X = k => P[k][0] * W, Y = k => P[k][1] * W;
  const mx = (a, b) => (X(a) + X(b)) / 2, my = (a, b) => (Y(a) + Y(b)) / 2;
  ctx.beginPath();
  if (kind === 'dot') {
    ctx.arc(X(0), Y(0), Math.max(0.5, s.w * W * pw(s, 0)) / 2, 0, Math.PI * 2);
    ctx.fill();
    return;
  }
  ctx.lineWidth = Math.max(0.5, s.w * W * pw(s, i));
  if (kind === 'head') { ctx.moveTo(X(0), Y(0)); ctx.lineTo(mx(0, 1), my(0, 1)); }
  else if (kind === 'mid') { ctx.moveTo(mx(i - 1, i), my(i - 1, i)); ctx.quadraticCurveTo(X(i), Y(i), mx(i, i + 1), my(i, i + 1)); }
  else { ctx.moveTo(mx(n - 2, n - 1), my(n - 2, n - 1)); ctx.lineTo(X(n - 1), Y(n - 1)); }
  ctx.stroke();
}
function drawStroke(s) {
  const n = s.p.length;
  if (!n) return;
  const W = inkCanvas.width;
  inkCtx.save();
  applyStyle(inkCtx, s);
  if (n === 1) seg(inkCtx, s, W, 'dot', 0);
  else {
    seg(inkCtx, s, W, 'head', 0);
    for (let i = 1; i <= n - 2; i++) seg(inkCtx, s, W, 'mid', i);
    seg(inkCtx, s, W, 'tail', n - 1);
  }
  inkCtx.restore();
}
function drawIncremental(s) {
  const n = s.p.length, W = inkCanvas.width;
  inkCtx.save();
  applyStyle(inkCtx, s);
  if (n === 1) seg(inkCtx, s, W, 'dot', 0);
  else if (n === 2) seg(inkCtx, s, W, 'head', 0);
  else seg(inkCtx, s, W, 'mid', n - 2);
  inkCtx.restore();
}

function normPoint(e) {
  const rect = inkCanvas.getBoundingClientRect();
  const x = r5((e.clientX - rect.left) / rect.width);
  const y = r5((e.clientY - rect.top) / rect.width);          // in Seitenbreiten
  if (e.pointerType === 'pen' && e.pressure > 0) return [x, y, Math.round(e.pressure * 100) / 100];
  return [x, y];
}

// --- Radierer: entfernt ganze Striche (statt Radier-Striche zu speichern) ---
function segDist(pt, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const l2 = dx * dx + dy * dy;
  let t = l2 ? ((pt[0] - a[0]) * dx + (pt[1] - a[1]) * dy) / l2 : 0;
  t = clamp(t, 0, 1);
  return Math.hypot(pt[0] - (a[0] + t * dx), pt[1] - (a[1] + t * dy));
}
function strokeHit(s, pt, r) {
  const P = s.p;
  if (P.length === 1) return Math.hypot(P[0][0] - pt[0], P[0][1] - pt[1]) <= r;
  for (let i = 1; i < P.length; i++) if (segDist(pt, P[i - 1], P[i]) <= r) return true;
  return false;
}
function eraseAt(pt) {
  const r = Math.max(0.006, tool.width * 3 / REF_W);
  const strokes = getStrokes();
  let changed = false;
  for (let i = strokes.length - 1; i >= 0; i--) {
    const s = strokes[i];
    if (s.er) continue;
    if (strokeHit(s, pt, r + s.w / 2)) { strokes.splice(i, 1); erasedItems.push({ stroke: s, index: i }); changed = true; }
  }
  if (changed) redrawInk();
}

// --- Undo -------------------------------------------------------
function pushHistory(a) { history.push(a); if (history.length > 300) history.shift(); }
function undo() {
  if (!ready || !pageReady) return;
  const strokes = getStrokes();
  for (let i = history.length - 1; i >= 0; i--) {
    const a = history[i];
    if (a.page !== currentPage) continue;
    history.splice(i, 1);
    if (a.type === 'add') { const k = strokes.indexOf(a.stroke); if (k >= 0) strokes.splice(k, 1); }
    else if (a.type === 'erase') { for (let j = a.items.length - 1; j >= 0; j--) strokes.splice(Math.min(a.items[j].index, strokes.length), 0, a.items[j].stroke); }
    else if (a.type === 'clear') { annotData.pages[String(currentPage)] = a.strokes; }
    redrawInk(); queueSave();
    return;
  }
  if (strokes.length) { strokes.pop(); redrawInk(); queueSave(); }   // Strich aus früherer Sitzung
}

// --- Zeigereingabe ------------------------------------------------
function touchDraws() { return fingerMode === 'draw' || (fingerMode === 'auto' && !penSeen); }

function beginStroke(e) {
  drawing = true; strokePointer = e.pointerId;
  strokeErasing = tool.eraser || (e.buttons & 32) !== 0;          // Stift-Radierertaste
  const pt = normPoint(e);
  if (strokeErasing) { currentStroke = null; erasedItems = []; eraseAt(pt); return; }
  currentStroke = { c: tool.color, w: tool.width / REF_W, p: [pt] };
  drawIncremental(currentStroke);
}
function addPoint(ev) {
  const pt = normPoint(ev);
  if (strokeErasing) { eraseAt(pt); return; }
  const last = currentStroke.p[currentStroke.p.length - 1];
  if (Math.hypot(pt[0] - last[0], pt[1] - last[1]) < MIN_POINT_DIST) return;
  currentStroke.p.push(pt);
  drawIncremental(currentStroke);
}
function endStroke() {
  if (!drawing) return;
  drawing = false;
  if (strokeErasing) {
    if (erasedItems && erasedItems.length) { pushHistory({ type: 'erase', page: currentPage, items: erasedItems }); queueSave(); }
    erasedItems = null;
  } else if (currentStroke) {
    const s = currentStroke;
    currentStroke = null;
    if (s.p.length > 1) { getStrokes().push(s); pushHistory({ type: 'add', page: currentPage, stroke: s }); queueSave(); }
    redrawInk();
  }
  currentStroke = null; strokePointer = null;
}
function cancelStroke() {
  if (!drawing) return;
  drawing = false; currentStroke = null; strokePointer = null;
  if (strokeErasing && erasedItems && erasedItems.length) { pushHistory({ type: 'erase', page: currentPage, items: erasedItems }); queueSave(); }
  erasedItems = null;
  redrawInk();
}

inkCanvas.addEventListener('pointerdown', (e) => {
  if (!ready || !pageReady) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.pointerType === 'pen') { penSeen = true; updateFingerBtn(); }
  try { inkCanvas.setPointerCapture(e.pointerId); } catch (err) {}
  if (e.pointerType === 'touch') {
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (touches.size >= 2) { cancelStroke(); panState = null; if (!pinchState) startPinch(); return; }   // zwei Finger: zoomen/verschieben
    if (gestureLock || penDown) return;                                                                 // Handballen ignorieren
    if (!touchDraws()) { panState = { id: e.pointerId, x: e.clientX, y: e.clientY }; return; }           // Finger scrollt
  } else if (e.pointerType === 'pen') {
    penDown = true;
  }
  beginStroke(e);
});

inkCanvas.addEventListener('pointermove', (e) => {
  if (e.pointerType === 'touch') {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinchState) { updatePinch(); return; }
    if (panState && panState.id === e.pointerId) {
      canvasWrap.scrollLeft -= e.clientX - panState.x;
      canvasWrap.scrollTop -= e.clientY - panState.y;
      panState.x = e.clientX; panState.y = e.clientY;
      return;
    }
  }
  if (drawing && e.pointerId === strokePointer) {
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
    (evs.length ? evs : [e]).forEach(addPoint);
  }
});

function onPointerEnd(e) {
  if (e.pointerType === 'touch') {
    touches.delete(e.pointerId);
    if (panState && panState.id === e.pointerId) panState = null;
    if (pinchState && touches.size < 2) pinchState = null;
    if (touches.size === 0) gestureLock = false;
  }
  if (e.pointerType === 'pen') penDown = false;
  if (drawing && e.pointerId === strokePointer) endStroke();
}
inkCanvas.addEventListener('pointerup', onPointerEnd);
inkCanvas.addEventListener('pointercancel', onPointerEnd);

// --- Toolbar ---------------------------------------------------------
document.querySelectorAll('.swatch').forEach(sw => {
  sw.addEventListener('click', () => {
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    tool.color = sw.dataset.color;
    tool.eraser = false;
    $('eraserBtn').style.background = '';
  });
});
$('widthRange').addEventListener('input', (e) => { tool.width = Number(e.target.value); });
$('eraserBtn').addEventListener('click', () => {
  tool.eraser = !tool.eraser;
  $('eraserBtn').style.background = tool.eraser ? 'var(--accent-light)' : '';
});
$('undoBtn').addEventListener('click', undo);
$('clearBtn').addEventListener('click', () => {
  if (!ready || !pageReady) return;
  const old = getStrokes();
  if (!old.length) return;
  if (!confirm('Alle Notizen/Zeichnungen dieser Seite löschen?')) return;
  pushHistory({ type: 'clear', page: currentPage, strokes: old });
  annotData.pages[String(currentPage)] = [];
  redrawInk();
  queueSave();
});
$('saveBtn').addEventListener('click', () => { if (ready) { dirty = true; saveNow(); } });
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z' && document.activeElement !== notesArea) {
    e.preventDefault(); undo();
  }
});

function updateFingerBtn() {
  const label = { auto: penSeen ? '✋ Auto: scrollt' : '✋ Auto: zeichnet', draw: '✋ zeichnet', pan: '✋ scrollt' }[fingerMode];
  $('fingerBtn').textContent = label;
}
$('fingerBtn').addEventListener('click', () => {
  fingerMode = { auto: 'draw', draw: 'pan', pan: 'auto' }[fingerMode];
  lsSet('gapp_fingerMode', fingerMode);
  updateFingerBtn();
});
updateFingerBtn();

// ---------------------------------------------------------------
// Notizen (pro Blatt oder pro Seite)
// ---------------------------------------------------------------
function bindNotes() {
  if (totalPages <= 1) notesScope = 'file';
  const tabPage = $('tabPage');
  tabPage.style.display = totalPages > 1 ? '' : 'none';
  tabPage.textContent = `Seite ${currentPage}`;
  $('tabFile').classList.toggle('active', notesScope === 'file');
  tabPage.classList.toggle('active', notesScope === 'page');
  notesArea.value = notesScope === 'file' ? (annotData.notes || '') : (annotData.pageNotes[String(currentPage)] || '');
  notesArea.disabled = !ready;
}
$('tabFile').addEventListener('click', () => { notesScope = 'file'; bindNotes(); });
$('tabPage').addEventListener('click', () => { notesScope = 'page'; bindNotes(); });
notesArea.addEventListener('input', () => {
  if (!ready) return;
  if (notesScope === 'file') annotData.notes = notesArea.value;
  else annotData.pageNotes[String(currentPage)] = notesArea.value;
  queueSave();
});
$('notesArrow').addEventListener('click', () => {
  const collapsed = notesArea.style.display === 'none';
  notesArea.style.display = collapsed ? 'block' : 'none';
  $('notesArrow').textContent = collapsed ? '▾' : '▸';
});

// ---------------------------------------------------------------
// Upload / Sidebar / Resize
// ---------------------------------------------------------------
$('uploadBtn').addEventListener('click', () => {
  const tokenOk = accessToken && Date.now() < tokenExpiry;
  if (!tokenOk) {
    setStatus('Bitte zuerst anmelden', 'error');
    lastErrorDetail = 'Nicht angemeldet – bitte anmelden, danach «Blatt hinzufügen» erneut tippen.';
    if (tokenClient) signIn();                        // Klick zählt als Nutzeraktion → Popup erlaubt
    return;
  }
  if (!folderId) {                                    // angemeldet, aber Drive-Ordner nicht ermittelt → erneut versuchen und Fehler zeigen
    setStatus('Verbinde mit Drive …', 'saving');
    afterSignIn().then(() => setStatus('Bereit – «Blatt hinzufügen» erneut tippen', 'ok'))
      .catch(e => { fail('Verbindung zu Drive fehlgeschlagen', e); showAuthError(explainError(e)); signedOutEl.style.display = 'flex'; });
    return;
  }
  $('fileInput').click();
});
$('fileInput').addEventListener('change', (e) => { if (e.target.files.length) uploadFiles(e.target.files); e.target.value = ''; });
$('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));

window.addEventListener('resize', () => { if (ready) { applyCssSize(); scheduleRender(200); } });

// ---------------------------------------------------------------
// Boot
// ---------------------------------------------------------------
window.addEventListener('load', () => {
  const check = setInterval(() => {
    if (window.google && google.accounts) { clearInterval(check); initAuth(); }
  }, 100);
});
</script>
</body>
</html>
